<?xml version="1.0" encoding="UTF-8"?>
<!--
  Site copy of assets/preview_social_dark.svg for the landing hero, its frame widened by 160px a
  side. The frame, wordmark and text follow the accent-3, fg and accent tokens in
  site/app/styles/tokens.css; the kst sync line keeps the CLI colors from src/colors.rs. An <img>
  cannot read CSS variables, so a token change is copied here by hand.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-160 0 1600 558" width="1600" height="558" font-family="'JetBrainsMono Nerd Font Mono','JetBrainsMono NFM','Iosevka Nerd Font Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
  <title>Kasetto: a declarative AI agent environment manager, written in Rust</title>
  <!-- outline border -->
  <rect x="-120" y="40" width="1520" height="478" fill="none" stroke="#aa89c2" stroke-width="4"/>

  <!--
    ASCII wordmark - left-anchored. Block width at font-size 30 in JetBrains Mono
    about 1050px; x=122 centres it in the original 1200px frame.

    Drawn as two layers over one grid so the letters read as stacked tiles rather
    than a solid slab: the box-drawing rules render unmasked, keeping the shadow
    outline continuous, while the full blocks are masked by a 3px transparent line on
    every row seam. Seams sit 3.5px under each baseline (113 + 34n), so moving y
    or dy means moving the mask lines with them; widening stroke-width opens the
    gaps, and dropping the mask attribute restores the solid wordmark.
  -->
  <defs>
    <mask id="wordmark-tiles" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="558">
      <rect width="1280" height="558" fill="#fff"/>
      <g stroke="#000" stroke-width="3">
        <line x1="118" y1="116.5" x2="1190" y2="116.5"/>
        <line x1="118" y1="150.5" x2="1190" y2="150.5"/>
        <line x1="118" y1="184.5" x2="1190" y2="184.5"/>
        <line x1="118" y1="218.5" x2="1190" y2="218.5"/>
        <line x1="118" y1="252.5" x2="1190" y2="252.5"/>
      </g>
    </mask>
  </defs>
  <g fill="#aa89c2" font-size="30" font-weight="700" xml:space="preserve">
    <text x="122" y="113" xml:space="preserve">
      <tspan x="122" dy="0">  ╗    ╗      ╗        ╗       ╗        ╗        ╗       ╗</tspan>
      <tspan x="122" dy="34">  ║   ╔╝  ╔══  ╗  ╔════╝  ╔════╝╚══  ╔══╝╚══  ╔══╝  ╔═══  ╗</tspan>
      <tspan x="122" dy="34">     ╔╝        ║       ╗     ╗       ║        ║     ║     ║</tspan>
      <tspan x="122" dy="34">  ╔═  ╗   ╔══  ║╚════  ║  ╔══╝       ║        ║     ║     ║</tspan>
      <tspan x="122" dy="34">  ║    ╗  ║    ║       ║       ╗     ║        ║   ╚      ╔╝</tspan>
      <tspan x="122" dy="34">╚═╝  ╚═╝╚═╝  ╚═╝╚══════╝╚══════╝   ╚═╝      ╚═╝    ╚═════╝</tspan>
    </text>
    <text x="122" y="113" xml:space="preserve" mask="url(#wordmark-tiles)">
      <tspan x="122" dy="0">██   ██  █████  ███████ ███████ ████████ ████████  ██████</tspan>
      <tspan x="122" dy="34">██  ██  ██   ██ ██      ██         ██       ██    ██    ██</tspan>
      <tspan x="122" dy="34">█████   ███████ ███████ █████      ██       ██    ██    ██</tspan>
      <tspan x="122" dy="34">██  ██  ██   ██      ██ ██         ██       ██    ██    ██</tspan>
      <tspan x="122" dy="34">██   ██ ██   ██ ███████ ███████    ██       ██     ██████</tspan>
    </text>
  </g>

  <!-- tagline -->
  <text x="640" y="351" text-anchor="middle" fill="#e7e5e4" font-size="26" letter-spacing="0.01em" xml:space="preserve">
    <tspan fill="#a8a195">A declarative </tspan><tspan fill="#e7e5e4">AI agent environment manager</tspan><tspan fill="#a8a195">, written in </tspan><tspan fill="#e8a94d">Rust</tspan><tspan fill="#a8a195">.</tspan>
  </text>

  <!-- prompt + command -->
  <text x="640" y="397" text-anchor="middle" font-size="24" xml:space="preserve">
    <tspan fill="#e8a94d">❯</tspan><tspan fill="#e7e5e4"> kst </tspan><tspan fill="#e8a94d">sync</tspan>
  </text>

  <!-- chip strip totals -->
  <text x="640" y="437" text-anchor="middle" font-size="20" xml:space="preserve">
    <tspan fill="#e8a94d">●</tspan><tspan fill="#e7e5e4"> 4 </tspan><tspan fill="#e8a94d">updated</tspan><tspan fill="#a8a195">    </tspan><tspan fill="#84c578">●</tspan><tspan fill="#e7e5e4"> 2 </tspan><tspan fill="#84c578">added</tspan><tspan fill="#a8a195">    </tspan><tspan fill="#e87e6c">●</tspan><tspan fill="#e7e5e4"> 1 </tspan><tspan fill="#e87e6c">removed</tspan><tspan fill="#a8a195">    </tspan><tspan fill="#6e6759">●</tspan><tspan fill="#e7e5e4"> 11 </tspan><tspan fill="#a8a195">unchanged</tspan>
  </text>

  <!-- Japanese subtitle -->
  <text x="640" y="475" text-anchor="middle" fill="#d4b070" font-size="14" letter-spacing="0.4em" font-family="'Noto Sans Mono CJK JP','Noto Sans JP','Yu Gothic',sans-serif">スキル・パッケージ・マネージャー</text>
</svg>
